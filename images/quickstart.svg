<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img"
     aria-label="一键启动三步：打开仓库文件夹双击 web.bat，等待窗口启动，浏览器里拖 PDF 并下载">
  <defs>
    <style>
      .h { font-family:Georgia,"Songti SC",serif; fill:#111; letter-spacing:.1em; }
      .k { font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; fill:#111; font-weight:600; }
      .t { font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; fill:#1a1a1a; }
      .d { font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; fill:#5a5a5a; }
      .m { font-family:Consolas,"Cascadia Mono",monospace; fill:#111; }
    </style>
  </defs>

  <rect x="0" y="0" width="940" height="560" rx="10" fill="#ffffff" stroke="#cfcfcf"/>
  <text class="h" x="30" y="42" font-size="17">一键启动（Windows）</text>
  <line x1="30" y1="54" x2="120" y2="54" stroke="#111" stroke-width="2"/>

  <!-- ① 文件夹 -->
  <text class="k" x="30" y="86" font-size="13">① 打开仓库文件夹（能看到 web.bat 的那一层）</text>
  <rect x="30" y="98" width="420" height="180" rx="6" fill="#f7f7f7" stroke="#333"/>
  <g class="m" font-size="11">
    <text x="48" y="124">ipad-textbook-chapters\</text>
    <text x="68" y="146" font-weight="700">web.bat</text>
    <text x="300" y="146" font-size="10.5" fill="#111">← 双击它</text>
    <text x="68" y="168">app.html</text>
    <text x="68" y="190">ipadbook\</text>
    <text x="68" y="212">requirements.txt</text>
    <text x="68" y="234">images\</text>
    <text x="68" y="256">README.md</text>
  </g>

  <!-- ② 窗口 -->
  <text class="k" x="490" y="86" font-size="13">② 双击后会出现这个窗口</text>
  <rect x="490" y="98" width="420" height="180" rx="6" fill="#2b2b2b" stroke="#111"/>
  <rect x="490" y="98" width="420" height="22" rx="6" fill="#1c1c1c"/>
  <g fill="#e8e8e8">
    <circle cx="506" cy="109" r="3.5"/><circle cx="520" cy="109" r="3.5"/><circle cx="534" cy="109" r="3.5"/>
  </g>
  <g class="m" font-size="10.5" fill="#e8e8e8">
    <text x="506" y="140">ipadbook - 图形界面</text>
    <text x="506" y="164">[ipadbook] 正在启动本地服务，浏览器会自动打开</text>
    <text x="506" y="182">         http://127.0.0.1:8765</text>
    <text x="506" y="206">[ipadbook] 用完后关掉这个窗口（或按 Ctrl+C）</text>
    <text x="506" y="230">         就会停止服务。</text>
    <text x="506" y="256">图形界面已启动：http://127.0.0.1:8765/</text>
  </g>

  <!-- ③ 浏览器 -->
  <text class="k" x="30" y="316" font-size="13">③ 浏览器自动打开，拖 PDF 进去</text>
  <rect x="30" y="328" width="880" height="150" rx="6" fill="#f7f7f7" stroke="#333"/>
  <rect x="30" y="328" width="880" height="24" rx="6" fill="#e9e9e9" stroke="#333"/>
  <text class="m" x="46" y="345" font-size="10">127.0.0.1:8765</text>
  <rect x="46" y="366" width="250" height="96" rx="4" fill="#ffffff" stroke="#666" stroke-dasharray="5 4"/>
  <text class="t" x="171" y="404" font-size="11" text-anchor="middle">壹 · 拖 PDF 进来</text>
  <text class="d" x="171" y="424" font-size="10" text-anchor="middle">识别与切分的进度在这里</text>
  <rect x="312" y="366" width="270" height="96" rx="4" fill="#ffffff" stroke="#666"/>
  <text class="t" x="447" y="392" font-size="11" text-anchor="middle">贰 · 切分结果预览</text>
  <g fill="#e2e2e2" stroke="#999">
    <rect x="326" y="404" width="42" height="46" rx="2"/>
    <rect x="374" y="404" width="42" height="46" rx="2"/>
    <rect x="422" y="404" width="42" height="46" rx="2"/>
    <rect x="470" y="404" width="42" height="46" rx="2"/>
    <rect x="518" y="404" width="42" height="46" rx="2"/>
  </g>
  <rect x="598" y="366" width="296" height="96" rx="4" fill="#ffffff" stroke="#666"/>
  <text class="t" x="746" y="392" font-size="11" text-anchor="middle">叁 · 拿走去 iPad</text>
  <rect x="618" y="404" width="120" height="30" rx="3" fill="#f0f0f0" stroke="#333"/>
  <text class="d" x="678" y="423" font-size="9.5" text-anchor="middle">下载整本（带目录）</text>
  <rect x="750" y="404" width="120" height="30" rx="3" fill="#f0f0f0" stroke="#333"/>
  <text class="d" x="810" y="423" font-size="9.5" text-anchor="middle">下载 ZIP（章节）</text>
  <text class="d" x="746" y="452" font-size="9.5" text-anchor="middle">传到 iPad → 共享 → 笔记 App</text>

  <text class="d" x="30" y="506" font-size="10.5">
    不需要命令行、不需要记参数：双击 web.bat → 浏览器打开 → 拖 PDF → 模块三下载 → 隔空投送到 iPad。
  </text>
  <text class="d" x="30" y="528" font-size="10.5">
    前置条件：已装 Python 3.10+（安装时勾选 Add Python to PATH）。首次运行要联网装依赖（1–3 分钟），之后秒开。
  </text>
</svg>
